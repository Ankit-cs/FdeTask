version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: chatdb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chatdb
    ports:
      - "5432:5432"
    volumes:
      - chatdb_postgres_data:/var/lib/postgresql/data

volumes:
  chatdb_postgres_data:
